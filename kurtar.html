<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veri Kurtarma — Enes Akvaryum</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#020810;color:#cce8f8;font-family:system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
.box{background:#060e1c;border:1px solid #0a1e35;border-radius:20px;padding:2rem;width:100%;max-width:480px;}
h1{color:#2de0cc;font-size:20px;margin-bottom:0.5rem;}
p{color:#6aaec8;font-size:14px;margin-bottom:1.5rem;line-height:1.6;}
.info{background:#040f1c;border:1px solid #102840;border-radius:12px;padding:1rem;margin-bottom:1.5rem;font-size:13px;color:#6aaec8;}
.info b{color:#cce8f8;}
#status{border-radius:10px;padding:1rem;font-size:14px;text-align:center;display:none;margin-bottom:1rem;}
.ok{background:rgba(45,224,204,0.1);border:1px solid rgba(45,224,204,0.3);color:#2de0cc;}
.err{background:rgba(220,50,50,0.1);border:1px solid rgba(220,50,50,0.3);color:#e05555;}
button{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity 0.2s;}
#recoverBtn{background:linear-gradient(135deg,#2de0cc,#3a9fd4);color:#020810;margin-bottom:10px;}
#recoverBtn:disabled{opacity:0.5;cursor:not-allowed;}
#closeBtn{background:rgba(255,255,255,0.06);color:#6aaec8;font-size:13px;}
</style>
</head>
<body>
<div class="box">
  <h1>🔄 Veri Kurtarma</h1>
  <p>Bu tarayıcıda kayıtlı balık/bitki/akvaryum verilerini bulup sunucuya yükler.</p>
  <div class="info" id="infoBox">Veriler aranıyor...</div>
  <div id="status"></div>
  <button id="recoverBtn" onclick="recover()" disabled>Verileri Yükle</button>
  <br>
  <button id="closeBtn" onclick="window.location.href='/'">Ana Sayfaya Dön</button>
</div>

<script>
const WORKER = 'https://enes-api.cankkeskin-52.workers.dev';
const API_KEY = 'Enesakvaryum2024';

function getSrc() {
  try {
    const lc = JSON.parse(localStorage.getItem('enes_cache') || '{}');
    if (lc.fish && lc.fish.length) return lc;
  } catch(e) {}
  try {
    const lb = JSON.parse(localStorage.getItem('enes_fish_backup') || '{}');
    if (lb.fish && lb.fish.length) return lb;
  } catch(e) {}
  return null;
}

const src = getSrc();
const infoBox = document.getElementById('infoBox');
const btn = document.getElementById('recoverBtn');

if (src) {
  infoBox.innerHTML = `✅ Veri bulundu:<br><br>
    <b>${src.fish?.length || 0}</b> balık<br>
    <b>${src.plants?.length || 0}</b> bitki<br>
    <b>${src.aquariums?.length || 0}</b> akvaryum<br>
    <b>${src.reviews?.length || 0}</b> yorum`;
  btn.disabled = false;
  btn.textContent = 'Verileri Yükle →';
} else {
  infoBox.innerHTML = '⚠️ Bu tarayıcıda kayıtlı veri bulunamadı.<br><br>Balıkların girildiği telefon/bilgisayardan bu sayfayı aç.';
  btn.textContent = 'Veri Yok';
}

async function recover() {
  if (!src) return;
  btn.disabled = true;
  btn.textContent = 'Yükleniyor...';
  const status = document.getElementById('status');
  status.style.display = 'block';
  status.className = 'ok';
  status.textContent = '⏳ Sunucuya gönderiliyor...';
  try {
    const payload = {
      fish: src.fish || [],
      aquariums: src.aquariums || [],
      reviews: src.reviews || [],
      plants: src.plants || [],
      subscribers: src.subscribers || [],
      visits: src.visits || 0
    };
    const r = await fetch(WORKER, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
      body: JSON.stringify(payload)
    });
    if (r.ok) {
      status.textContent = `✅ Başarılı! ${payload.fish.length} balık, ${payload.plants.length} bitki, ${payload.aquariums.length} akvaryum yüklendi. Artık herkes görebilir.`;
      btn.textContent = '✓ Tamamlandı';
    } else {
      throw new Error('Sunucu hatası: ' + r.status);
    }
  } catch(e) {
    status.className = 'err';
    status.textContent = '✗ Hata: ' + e.message;
    btn.disabled = false;
    btn.textContent = 'Tekrar Dene';
  }
}
</script>
</body>
</html>
